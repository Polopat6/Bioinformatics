# environment.yml
#
# SINGLE SOURCE OF TRUTH for every dependency the Multi-Omics Bioinformatics
# Portal needs -- Python packages, R/Bioconductor packages, AND external CLI
# bioinformatics tools -- so Docker, HPC (conda/mamba), and local installs
# all build from exactly this one file instead of drifting out of sync.
#
# --- 10x_bamtofastq addition (2026-08-24) ---
# Added to support recovering usable FASTQ (with intact cell barcode/UMI
# sequences) from an original-format 10x Genomics BAM file, for SRA
# depositions whose standard FASTQ extraction has no usable barcode/UMI
# information at all -- confirmed real, motivating case: Kang et al. 2018
# (GSE96583), a v1-chemistry-era 10x deposition where the barcode/UMI
# reads were never uploaded to SRA as FASTQ at all (only the cDNA read
# was). See single_cell/sc_sra_manager.py's own module docstring,
# "Original-format BAM recovery", for the full technical rationale,
# including the confirmed, real limitation that NCBI increasingly serves
# original-format submissions ONLY from AWS/GCP cloud storage requiring
# the user's own paid cloud-billing account -- this tool is only useful
# for the subset of (typically older) runs where a free, direct-HTTP
# legacy copy still exists.
#
# Confirmed on bioconda as package name "10x_bamtofastq" (MIT licensed,
# tiny footprint, cross-platform including linux-aarch64/osx-arm64) --
# provides the `bamtofastq` executable this project's sc_sra_manager.py
# invokes directly via subprocess.
#
# --- pigz addition (2026-08-25) ---
# Added after a real, confirmed production bottleneck: compressing a
# single 83.5GB FASTQ file (fasterq-dump's own uncompressed output) took
# approximately 7 hours using Python's built-in gzip module at its
# default compresslevel=9 -- the SLOWEST available setting (unlike
# command-line gzip's own default of 6, for only marginal extra size
# savings -- confirmed directly: ~1.86x slower for ~1.3% smaller output
# on test data, with real biological sequence data typically showing an
# even wider gap), running entirely single-threaded regardless of how
# many CPU cores are actually available on the machine (e.g. a 32-core
# HPC node). pigz (parallel gzip) fixes both problems at once -- it
# supports the standard, faster compresslevel default AND spreads the
# work across multiple threads. single_cell/sc_sra_manager.py's own
# _gzip_and_remove() now prefers pigz via subprocess when it's
# installed, falling back to Python's gzip module at compresslevel=6
# (not 9) when it isn't -- either path produces a completely standard,
# fully valid .gz file. No version pin needed: pigz is a small, stable,
# long-unchanged utility where exact version has no bearing on
# reproducibility, unlike e.g. star=2.7.11b or sra-tools=3.1.* above it,
# where exact tool behavior/output format genuinely matters.
#
# --- seqkit addition (2026-09-01) ---
# Added after a real, confirmed production bottleneck: single_cell/
# singlecell_trim_manager.py's own R1/R2 resync step (re-syncing R1 down
# to only the reads that survived fastp's R2-only trimming) originally
# read both FASTQ files line-by-line in pure Python, building a Python
# set() of surviving read IDs from R2 and checking every R1 read against
# it. This is correct but does NOT scale to real single-cell run depths --
# confirmed directly on SRR13734384 (~776 million reads), where this
# pure-Python resync step alone took several HOURS for a single sample,
# even though fastp's own R2 trimming (a real, multithreaded, compiled
# C++ tool) finished quickly. Critically, the pipeline's own "threads"
# slider had ZERO effect on this bottleneck, since that value is only
# ever passed to fastp's own --thread flag -- the slow resync step is a
# fully separate, single-threaded Python operation fastp's own
# concurrency can't touch at all.
#
# seqkit (a fast, single-binary, compiled Go tool) fixes this: two of its
# own long-stable subcommands (`seqkit seq -n --only-id` to extract
# surviving R2 read IDs, then `seqkit grep -f` to filter R1 by that same
# list) replace the pure-Python two-pass approach entirely, avoiding ever
# holding millions of read IDs in a Python set(). See single_cell/
# singlecell_trim_manager.py's own module docstring, "R1/R2 resync
# performance fix", for full detail, including the automatic (slower,
# but still correct) pure-Python fallback this module now uses if seqkit
# is not installed, with a loud, explicit warning surfaced rather than a
# silent slowdown.
#
# No version pin needed: like pigz above, seqkit's core seq/grep
# subcommands used here are small, stable, long-unchanged functionality
# where exact version has no bearing on reproducibility.
name: bioportal
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # -------------------------------------------------------------------
  # Core language runtimes
  # -------------------------------------------------------------------
  - python=3.11
  - r-base=4.3

  # -------------------------------------------------------------------
  # External CLI bioinformatics tools
  # -------------------------------------------------------------------
  - fastqc=0.12.*
  - multiqc=1.21.*
  - fastp=0.23.*
  - salmon=1.10.*
  - star=2.7.11b
  - sra-tools=3.1.*           # NCBI/SRA download (prefetch + fasterq-dump)
  - pigz                      # Parallel gzip -- fast multi-threaded compression of
                               # fasterq-dump's own uncompressed FASTQ output (Python's
                               # single-threaded gzip module was confirmed, in real
                               # production use, to take ~7 hours on one 83.5GB FASTQ
                               # file at its default compresslevel=9; see
                               # single_cell/sc_sra_manager.py's own _gzip_and_remove()
                               # for the fix that prefers pigz here when available)
  - seqkit                    # Fast R1/R2 resync in single_cell/singlecell_trim_manager.py --
                               # replaces a pure-Python line-by-line implementation confirmed
                               # to take multiple HOURS on a real, extreme-depth single-cell
                               # run (SRR13734384, ~776M reads); see this file's own header
                               # comment above and that module's own docstring for full detail
  - gffread
  - nextflow
  - alevin-fry               # Single-cell RNA-Seq: optional faster alternate to STARsolo

  # --- Single-cell RNA-Seq: original-format BAM recovery (2026-08-24) ---
  # See this file's own header comment above for the full rationale.
  # Provides the `bamtofastq` executable, invoked by
  # single_cell/sc_sra_manager.py's run_bamtofastq() for the subset of
  # SRA runs whose standard FASTQ extraction lacks usable barcode/UMI
  # data, but which still have a free, directly-downloadable
  # original-format BAM (see find_original_format_bam_url()) rather than
  # requiring the user's own AWS/GCP cloud-billing account.
  - 10x_bamtofastq

  # -------------------------------------------------------------------
  # Python packages
  # -------------------------------------------------------------------
  - streamlit=1.37.*
  - pandas=2.2.*
  - plotly=5.22.*
  - python-kaleido
  - duckdb=1.0.*
  - openpyxl=3.1.*
  - scipy=1.13.*
  - paramiko=3.4.*
  - requests=2.32.*

  # --- Single-cell RNA-Seq: Python analysis layer (Phase 3) ---
  - scanpy
  - anndata
  - python-igraph
  - leidenalg
  - harmonypy
  - celltypist
  - scikit-learn

  # -------------------------------------------------------------------
  # R / Bioconductor packages
  # -------------------------------------------------------------------
  # Left UNPINNED -- see "REPRODUCIBILITY NOTE" (full rationale in prior
  # revisions of this file): Bioconductor's twice-yearly release cadence
  # does not bump every package's version every cycle, and a hand-picked
  # exact version can easily name a release that was never published.
  - bioconductor-deseq2
  - r-jsonlite
  - bioconductor-tximport
  - bioconductor-clusterprofiler
  - bioconductor-reactompa
  - bioconductor-gosemsim
  - bioconductor-limma
  - r-duckdb
  - r-dbi
  - r-tidyr

  # --- Single-cell RNA-Seq: R-based cell-level QC (Phase 2) ---
  - bioconductor-dropletutils
  - bioconductor-scuttle
  - bioconductor-scdblfinder
  - r-seurat
  - r-remotes
  - bioconductor-celda
  - r-soupx

  # --- Single-cell RNA-Seq: R-based compositional analysis (Phase 3.9) ---
  - bioconductor-speckle

  # --- eggNOG-mapper: shared orthology-based functional annotation ---
  # NOTE (2026-08-24): the bioconda "eggnog-mapper" package (2.1.x) has a
  # confirmed BROKEN database-download mechanism -- its own
  # download_eggnog_data.py still points at a decommissioned host
  # (eggnogdb.embl.de / eggnog5.embl.de), which now 404s on every file.
  # The only confirmed-working version is v3.0.0-beta6 (GitHub release,
  # migrated to a new host), but it is an explicit pre-release with
  # breaking output-schema changes not yet reflected in this project's
  # own eggnog_manager.py parser. DEFERRED pending either a stable
  # non-beta release with working downloads, or bioconda catching up --
  # the package is still listed here since installing the TOOL itself is
  # harmless; only its DATABASE download is currently non-functional.
  - eggnog-mapper

  # -------------------------------------------------------------------
  # Organism annotation packages (org.*.db), one per PRESET species
  # -------------------------------------------------------------------
  - bioconductor-org.hs.eg.db
  - bioconductor-org.mm.eg.db
  - bioconductor-org.dm.eg.db
  - bioconductor-org.sc.sgd.db
  - bioconductor-org.ce.eg.db
  - bioconductor-org.dr.eg.db
  - bioconductor-org.eck12.eg.db

  # -------------------------------------------------------------------
  # pip-only packages
  # -------------------------------------------------------------------
  - pip
  - pip:
      - watchdog>=4.0,<5

# -------------------------------------------------------------------
# NOT included here (intentionally, per current project roadmap):
# -------------------------------------------------------------------
# - scvi-tools -- optional, heavier alternative to Harmony for batch
#   correction; add only once that specific path is actually implemented.
# - DoubletFinder (R package) -- NOT available via conda-forge, bioconda,
#   CRAN, or Bioconductor as of this writing (GitHub-only,
#   chris-mcginnis-ucsf/DoubletFinder). r-remotes is included above so it
#   CAN be installed as a one-time post-environment-creation step:
#     Rscript -e 'remotes::install_github("chris-mcginnis-ucsf/DoubletFinder")'
# - AWS/GCP cloud SDK tooling (e.g. awscli, google-cloud-sdk) for
#   retrieving original-format SRA submissions that have been moved to
#   cloud-only storage -- deliberately NOT automated by this project (see
#   this file's own "10x_bamtofastq addition" note above); retrieving
#   those specific runs requires the user's own cloud-billing account
#   and is treated as an out-of-scope, user-driven manual step.
